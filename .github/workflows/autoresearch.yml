name: "FORMLÆRE AutoResearch: litterær redaksjon"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: formlaere-literary-autoresearch
  cancel-in-progress: false

jobs:
  literary-editorial:
    if: github.repository == 'lukketsvane/FORML-RE' && github.ref == 'refs/heads/main' && (github.actor == 'lukketsvane' || github.actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - name: Checkout canonical manuscript
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare isolated literary branch and immutable baseline
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          branch="literary/autoresearch"
          report="traktat/revisjon/litteraer-autoresearch-$GITHUB_RUN_ID.md"
          if [ -n "$(git ls-remote --heads origin 'refs/heads/literary/autoresearch*')" ]; then
            echo "::error::Førre litterære forslag er ikkje ferdig behandla. Flett inn og slett arbeidsgrena før ei ny betalt køyring."
            exit 1
          fi
          git switch -c "$branch"
          git show HEAD:traktat/tekst/formlaere.tex > "$RUNNER_TEMP/original-formlaere.tex"
          grep -Fq '\section{Etterord}' traktat/tekst/formlaere.tex || { echo "::error::Etterordet må vere i main før neste litterære runde."; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Limit cumulative model API spending
        id: budget
        shell: bash
        env:
          CARBON_ENABLED: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from decimal import Decimal
          from pathlib import Path

          used = Decimal("0")
          for path in sorted(Path("traktat/revisjon").glob("*.md")):
              if not path.name.startswith(("litteraer-autoresearch-", "foreword-afterword-")):
                  continue
              costs = re.findall(r"\*\*Estimert API-kostnad:\*\*\s*([0-9]+(?:\.[0-9]+)?)\s*USD", path.read_text(encoding="utf-8"))
              if len(costs) != 1:
                  raise SystemExit(f"Missing API cost in {path}")
              used += Decimal(costs[0])
              carbon_costs = re.findall(r"\*\*Estimert Gemini Carbon API-kostnad:\*\*\s*([0-9]+(?:\.[0-9]+)?)\s*USD", path.read_text(encoding="utf-8"))
              if len(carbon_costs) > 1:
                  raise SystemExit(f"Duplicate Carbon cost in {path}")
              if carbon_costs:
                  used += Decimal(carbon_costs[0])
          remaining = Decimal("109") - used
          carbon_reserved = min(Decimal("1.5"), remaining / 2) if os.environ.get("CARBON_ENABLED") == "true" else Decimal("0")
          available = min(Decimal("20") - carbon_reserved, remaining - carbon_reserved)
          if available <= 0:
              raise SystemExit("109 USD research budget exhausted")
          print(f"Used {used} USD; this run is limited to {available} USD")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"max_usd={available}\n")
              output.write(f"carbon_usd={carbon_reserved}\n")
          PY

      - name: Gemini 4 Carbon HIGH writes independent alternatives
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CARBON_MAX_USD: ${{ steps.budget.outputs.carbon_usd }}
        run: |
          set -euo pipefail
          python3 research/litteraer-autoresearch/carbon_writer.py \
            "$RUNNER_TEMP/carbon-suggestions.md" "$RUNNER_TEMP/carbon-cost.txt"

      - name: Install Claude Code API client
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash

      - name: Adversarial literary redaction with Fable 5.2
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_PATH: ${{ steps.prepare.outputs.report }}
        run: |
          set -euo pipefail
          test -n "$ANTHROPIC_API_KEY"
          task="$RUNNER_TEMP/literary-task.txt"
          cat research/litteraer-autoresearch/program.md > "$task"
          {
            printf '\n\nEITT VERK, EITT REDAKSJONELT FORSØK.\n'
            printf 'Les heile traktat/tekst/formlaere.tex før du skriv. Forskingsemnet er verket som litteratur.\n'
            printf 'Les tråden i 491 proposisjonar, samanlikn fleire lesemåtar og motles kvar endring i heilskapen.\n'
            printf 'Rediger berre traktat/tekst/formlaere.tex, traktat/nettstad/kortversjon.tex, traktat/nettstad/kort.html og rapporten på %s.\n' "$REPORT_PATH"
            printf 'Skriv rapporten på nynorsk med seksjonane Behaldne, Forkasta, Heilskap og Uvisse.\n'
            printf 'Ikkje endre kjelder, likningar, proposisjonsnummer, testkode eller workflow.\n'
            printf 'Ikkje produser nye vurderingsmål. Ikkje la måling erstatte litterær dom.\n'
            printf 'Ikkje opprett PR eller push sjølv. Etter fullført bygg og test flettar GitHub Actions endringane automatisk i main.\n'
          } >> "$task"
          if [ -s "$RUNNER_TEMP/carbon-suggestions.md" ]; then
            printf '\n\nUAVHENGIGE GEMINI CARBON HIGH-FORSLAG. Prøv dei kritisk, ikkje kopier blindt. Forkast alt som ikkje styrkjer verket.\n' >> "$task"
            cat "$RUNNER_TEMP/carbon-suggestions.md" >> "$task"
          fi
          mkdir -p "$HOME/.claude"
          printf '%s\n' '{"attribution":false}' > "$HOME/.claude/settings.json"
          set +e
          "$HOME/.local/bin/claude" -p "$(cat "$task")" \
            --model claude-fable-5-2 \
            --effort high \
            --max-turns 50 \
            --max-budget-usd "${{ steps.budget.outputs.max_usd }}" \
            --permission-mode bypassPermissions \
            --tools "Read,Glob,Grep,Edit,Write,Agent" \
            --disallowedTools "Bash,mcp__*" \
            --output-format stream-json --verbose \
            | tee "$RUNNER_TEMP/claude-events.jsonl" \
            | jq --unbuffered -r '
                if .type == "assistant" then
                  (.message.content[]? | select(.type == "tool_use") | "Fable: \(.name)")
                elif .type == "result" then
                  "Fable: redaksjonen er ferdig"
                else empty end
              '
          code=$?
          set -e
          jq -s 'map(select(.type == "result")) | last // {"is_error":true}' \
            "$RUNNER_TEMP/claude-events.jsonl" > "$RUNNER_TEMP/claude-result.json"
          jq -r '"Estimert API-kostnad USD: \(.total_cost_usd // "ukjent")"' "$RUNNER_TEMP/claude-result.json"
          if [ "$code" -eq 0 ] && jq -e '.is_error == false' "$RUNNER_TEMP/claude-result.json" >/dev/null; then
            printf '\n**Estimert API-kostnad:** %s USD.\n' "$(jq -r '.total_cost_usd // "ukjent"' "$RUNNER_TEMP/claude-result.json")" >> "$REPORT_PATH"
            if [ -s "$RUNNER_TEMP/carbon-suggestions.md" ]; then
              printf '\n**Estimert Gemini Carbon API-kostnad:** %s USD.\n' "$(cat "$RUNNER_TEMP/carbon-cost.txt")" >> "$REPORT_PATH"
            fi
          fi
          if [ "$code" -ne 0 ] || ! jq -e '.is_error == false' "$RUNNER_TEMP/claude-result.json" >/dev/null; then
            echo "::error::Fable fullførte ikkje redaksjonen. Ingen manuskriptendring blir publisert."
            exit 1
          fi

      - name: Protect manuscript structure, mathematics and citations
        id: verify
        shell: bash
        env:
          REPORT_PATH: ${{ steps.prepare.outputs.report }}
        run: |
          set -euo pipefail
          python3 research/litteraer-autoresearch/check.py \
            "$RUNNER_TEMP/original-formlaere.tex" traktat/tekst/formlaere.tex "$REPORT_PATH"
          python3 - "$REPORT_PATH" <<'PY'
          import subprocess
          import sys
          import os
          report = sys.argv[1]
          modified = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          untracked = set(subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard"], text=True).splitlines())
          allowed = {
              "traktat/tekst/formlaere.tex",
              "traktat/nettstad/kortversjon.tex",
              "traktat/nettstad/kort.html",
          }
          if modified - allowed or untracked != {report}:
              raise SystemExit("Agent edited files outside the three allowed texts and report")
          changed = bool(modified & allowed)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"edition_changed={str(changed).lower()}\n")
          PY

      - name: Report no accepted improvements
        if: steps.verify.outputs.edition_changed != 'true'
        shell: bash
        run: echo "Ingen redaksjonelle endringar overlevde motlesing. Ingen ny betalt runde blir starta." >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python for literary edition
        if: steps.verify.outputs.edition_changed == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install edition dependencies
        if: steps.verify.outputs.edition_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r traktat/requirements-build.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-european \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2 pandoc

      - name: Build and test the complete edition
        if: steps.verify.outputs.edition_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd traktat
          make all
          make check-generated

      - name: Publish and auto-merge verified literary edition
        if: steps.verify.outputs.edition_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          REPORT_PATH: ${{ steps.prepare.outputs.report }}
        run: |
          set -euo pipefail
          git add -- traktat/tekst/formlaere.tex traktat/nettstad/kortversjon.tex traktat/nettstad/kort.html "$REPORT_PATH"
          if [ -f traktat/pdf/release.json ]; then
            git add -- traktat/pdf/formlaere.pdf traktat/pdf/formlaere-latex.zip \
              traktat/pdf/release.json traktat/nettstad/kortversjon.html
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Litterær motlesing av FORMLÆRE ($GITHUB_RUN_ID)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "FORMLÆRE: litterær heilskapsrevisjon ($GITHUB_RUN_ID)" \
            --body "Automatisk redaksjon av hovudtraktat, tl;dr og kortutgåva. Rapport: $REPORT_PATH. Matematiske uttrykk, kjelder og proposisjonsstruktur er verna. Fullt bygg og testar har bestått. Estimert API-kostnad er loggført. Automatisk squash-merge etter kontroll."
          current_base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_base" != "$(git rev-parse HEAD^)" ]; then
            echo "::error::Main endra seg under byggjet. Ikkje merge eldre utgåve."
            exit 1
          fi
          gh pr merge "$BRANCH" --squash --delete-branch

          balance="$(python3 - "$REPORT_PATH" <<'PY'
          import re
          import sys
          from decimal import Decimal
          from pathlib import Path
          files = sorted(Path("traktat/revisjon").glob("*.md"))
          used = Decimal("0")
          for path in files:
              if path.name.startswith(("litteraer-autoresearch-", "foreword-afterword-")):
                  matches = re.findall(r"\*\*Estimert API-kostnad:\*\*\s*([0-9]+(?:\.[0-9]+)?)\s*USD", path.read_text(encoding="utf-8"))
                  if len(matches) != 1:
                      raise SystemExit(f"Missing unique API cost in {path}")
                  used += Decimal(matches[0])
                  carbon = re.findall(r"\*\*Estimert Gemini Carbon API-kostnad:\*\*\s*([0-9]+(?:\.[0-9]+)?)\s*USD", path.read_text(encoding="utf-8"))
                  if len(carbon) > 1:
                      raise SystemExit(f"Duplicate Carbon cost in {path}")
                  if carbon:
                      used += Decimal(carbon[0])
          print(Decimal("109") - used)
          PY
          )"
          if python3 -c 'from decimal import Decimal; import sys; sys.exit(0 if Decimal(sys.argv[1]) > 0 else 1)' "$balance"; then
            echo "Neste litterære runde kan nytte inntil $balance USD av totalramma."
            gh workflow run autoresearch.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "Forskinga stoppar ved den samla ramma på 109 USD." >> "$GITHUB_STEP_SUMMARY"
          fi
