name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Inspect Fable availability in model selector
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(10000);
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.method(), req.url(), req.failure()?.errorText));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(3000);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1800);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(400);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(600);
            const card = page.getByText('Amazon Bedrock', { exact: true }).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button', { name: 'Configure' }).click();
            await page.waitForTimeout(3500);
            await page.locator('input[type="checkbox"]').evaluateAll(els => {
              for (const x of els) {
                const id=x.getAttribute('aria-labelledby');
                const label=id ? document.getElementById(id)?.innerText.trim() : '';
                if (label==='AI21 Labs' && x.checked) x.click();
                if (label==='Anthropic' && !x.checked) x.click();
              }
            });
            await page.waitForTimeout(1200);
            console.log('PROVIDER_STATES', JSON.stringify(await page.locator('input[type="checkbox"]').evaluateAll(els => els.map(x => {
              const id=x.getAttribute('aria-labelledby'); return {label:id?document.getElementById(id)?.innerText.trim():'',checked:x.checked};
            }).filter(x=>x.label))));
            console.log('ANTHROPIC_MODEL_BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            const modelButtons = page.getByRole('button', { name: 'Anthropic: Claude Haiku 4.5', exact: true });
            console.log('MODEL_BUTTON_COUNT', await modelButtons.count());
            if (await modelButtons.count()) {
              console.log('MODEL_BUTTON_HTML', await modelButtons.first().evaluate(el => el.outerHTML));
              try { await modelButtons.first().click({timeout:5000}); console.log('MODEL_MENU_OPEN', true); }
              catch (err) { console.log('MODEL_MENU_OPEN_ERROR', err.message); }
            }
            await page.waitForTimeout(800);
            console.log('FABLE_VISIBLE', await page.getByText(/Fable/i).count());
            console.log('MODEL_MENU_TEXT', (await page.locator('body').innerText()).slice(0, 11000));
            console.log('MODEL_OPTIONS', JSON.stringify(await page.locator('[role="option"]').evaluateAll(els => els.map(x => x.innerText.trim()))));
          } finally {
            await browser.close();
          }
          JS
