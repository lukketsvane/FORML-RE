name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read
concurrency:
  group: aws-pricing-estimate-helper-${{ github.sha }}
  cancel-in-progress: true
jobs:
  inspect-supporting-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Inspect S3 configuration
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(12000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2000);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1000);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);
            const bedrock=page.getByText('Amazon Bedrock',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await bedrock.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2000);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){const id=i.getAttribute('aria-labelledby');const label=id?document.getElementById(id)?.innerText.trim():'';if(label==='AI21 Labs'&&i.checked)i.click();if(label==='Anthropic'&&!i.checked)i.click();}
            });
            await page.waitForTimeout(600);
            await page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first().click();
            await page.waitForTimeout(350);
            await page.locator('[role="option"]').filter({hasText:'Anthropic: Claude Fable 5.1'}).first().click();
            await page.waitForTimeout(700);
            await page.getByLabel('Description - optional').fill('FORMLÆRE — 6-month research benchmark. Fable 5.1 Global is a conservative calculator proxy; intended Fable 5.2 US-geo offer: $8.80/M input, $44/M output; 400M input + 10M output = $3,960.');
            await page.locator('input[aria-label="Average requests per minute"]:visible').first().fill('1');
            await page.locator('input[aria-label="Hours per day at this rate"]:visible').first().fill('8');
            await page.locator('input[aria-label="Average input tokens per request"]:visible').first().fill('4629');
            await page.locator('input[aria-label="Average output tokens per request"]:visible').first().fill('116');
            await page.locator('input[aria-label="Average output tokens per request"]:visible').first().press('Tab');
            await page.waitForTimeout(900);
            await page.getByRole('button',{name:'Save and view summary',exact:true}).click();
            await page.waitForTimeout(1800);
            console.log('SUMMARY_URL',page.url());
            await page.getByRole('button',{name:'Add service',exact:true}).click();
            await page.waitForURL(/addService/,{timeout:20000});
            await page.waitForTimeout(1200);
            console.log('ADD_SERVICE_URL',page.url());
            console.log('SERVICE_CATALOGUE',(await page.locator('body').innerText()).slice(0,10000));
            console.log('S3_CARD_COUNT',await page.getByText('Amazon S3',{exact:true}).count());
            const s3=page.getByText('Amazon S3',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            console.log('S3_CARD_BUTTONS',JSON.stringify(await s3.getByRole('button').allTextContents()));
            await s3.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2500);
            console.log('S3_CONFIG_URL',page.url());
            console.log('S3_CONFIG_TEXT',(await page.locator('body').innerText()).slice(-14000));
            console.log('S3_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map((x,i)=>({i,aria:x.getAttribute('aria-label'),placeholder:x.placeholder,value:x.value,type:x.type,disabled:x.disabled,visible:!!x.offsetParent,rect:x.getBoundingClientRect().toJSON()})).filter(x=>x.visible))));
            console.log('S3_SELECTS',JSON.stringify(await page.locator('select').evaluateAll(els=>els.map(x=>({aria:x.getAttribute('aria-label'),value:x.value,options:[...x.options].map(o=>o.text)})))));
            console.log('S3_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
          }finally{await browser.close();}
          JS
