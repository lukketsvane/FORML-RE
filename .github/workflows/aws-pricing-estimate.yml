name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Open Bedrock configuration
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(25000);
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.method(), req.url(), req.failure()?.errorText));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(4000);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(3000);
            const region = page.getByRole('button', { name: 'US East (Ohio)' });
            console.log('REGION_BUTTON_COUNT', await region.count());
            await region.click();
            await page.waitForTimeout(1000);
            console.log('REGION_MENU_TEXT', (await page.locator('body').innerText()).slice(0, 7000));
            console.log('REGION_MENU_BUTTONS', JSON.stringify((await page.getByRole('button').allTextContents()).slice(0, 60)));
            const virginia = page.getByText('US East (N. Virginia)', { exact: true });
            console.log('VIRGINIA_OPTION_COUNT', await virginia.count());
            if (await virginia.count()) {
              await virginia.last().click();
              await page.waitForTimeout(1500);
            }
            const target = page.getByText('Amazon Bedrock', { exact: true }).first();
            const card = target.locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            console.log('BEDROCK_CARD_BUTTONS', JSON.stringify(await card.getByRole('button').allTextContents()));
            await card.getByRole('button', { name: 'Configure' }).click();
            await page.waitForTimeout(6000);
            console.log('CONFIG_URL', page.url());
            console.log('CONFIG_TEXT', (await page.locator('body').innerText()).slice(0, 18000));
            console.log('CONFIG_BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('CONFIG_INPUTS', JSON.stringify(await page.locator('input').evaluateAll(els => els.map(x => ({type:x.type,placeholder:x.placeholder,aria:x.getAttribute('aria-label'),name:x.name,value:x.value,outer:x.outerHTML.slice(0,400)})))));
            console.log('CONFIG_SELECTS', JSON.stringify(await page.locator('select').evaluateAll(els => els.map(x => ({aria:x.getAttribute('aria-label'),name:x.name,value:x.value,options:[...x.options].map(o=>({text:o.text,value:o.value})).slice(0,100)})))));
            console.log('CONFIG_COMBOBOXES', JSON.stringify(await page.getByRole('combobox').evaluateAll(els => els.map(x => ({text:x.innerText,aria:x.getAttribute('aria-label'),outer:x.outerHTML.slice(0,900)})))));
          } finally {
            await browser.close();
          }
          JS
