name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Inspect Bedrock service controls
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(25000);
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.method(), req.url(), req.failure()?.errorText));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(4000);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(3000);
            const result = await page.getByRole('button', { name: 'Configure' }).evaluateAll(btns => btns.map((b,i) => {
              const parents = [];
              let n = b;
              for (let k=0; n && k<9; k++, n=n.parentElement) {
                parents.push({tag:n.tagName, cls:String(n.className).slice(0,120), text:(n.innerText||'').slice(0,240)});
              }
              return {i, parents};
            }));
            console.log('CONFIGURE_BUTTON_ANCESTORS', JSON.stringify(result));
            const chain = await page.getByText('Amazon Bedrock', { exact: true }).first().evaluate(el => {
              const out=[]; let n=el;
              for(let k=0;n&&k<12;k++,n=n.parentElement) out.push({tag:n.tagName,cls:String(n.className).slice(0,160),text:(n.innerText||'').slice(0,320),buttons:[...n.querySelectorAll('button')].map(b=>b.innerText.trim())});
              return out;
            });
            console.log('BEDROCK_PARENT_CHAIN', JSON.stringify(chain));
          } finally {
            await browser.close();
          }
          JS
