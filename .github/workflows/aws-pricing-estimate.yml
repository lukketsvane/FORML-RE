name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-visible-bedrock-fields:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Inspect visible form fields
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1200);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(500);
            const card=page.getByText('Amazon Bedrock',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2200);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){const id=i.getAttribute('aria-labelledby');const label=id?document.getElementById(id)?.innerText.trim():'';if(label==='AI21 Labs'&&i.checked)i.click();if(label==='Anthropic'&&!i.checked)i.click();}
            });
            await page.waitForTimeout(700);
            await page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first().click();
            await page.waitForTimeout(400);
            await page.locator('[role="option"]').filter({hasText:'Anthropic: Claude Fable 5.1'}).first().click();
            await page.waitForTimeout(900);
            const fields=await page.locator('input[type="text"]').evaluateAll(els=>els.map((x,i)=>{
              const cs=getComputedStyle(x);const r=x.getBoundingClientRect();
              const ancestors=[];let p=x;for(let k=0;p&&k<5;k++,p=p.parentElement)ancestors.push({tag:p.tagName,cls:String(p.className).slice(0,100),display:getComputedStyle(p).display,visibility:getComputedStyle(p).visibility,ariaHidden:p.getAttribute('aria-hidden')});
              return {i,aria:x.getAttribute('aria-label'),value:x.value,display:cs.display,visibility:cs.visibility,offset:!!x.offsetParent,rect:{w:r.width,h:r.height,x:r.x,y:r.y},ancestors};
            }).filter(x=>x.aria));
            console.log('VISIBLE_FIELDS',JSON.stringify(fields));
            console.log('VISIBLE_COUNTS',JSON.stringify(await page.locator('input[aria-label="Average requests per minute"]').evaluateAll(els=>els.map((x,i)=>({i,visible:!!x.offsetParent,rect:x.getBoundingClientRect().toJSON(),parents:[x.parentElement?.innerText,x.parentElement?.parentElement?.innerText].map(t=>(t||'').slice(0,300))})))));
          }finally{await browser.close();}
          JS
