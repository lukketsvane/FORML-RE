name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Inspect Anthropic model catalogue
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(25000);
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.method(), req.url(), req.failure()?.errorText));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(4000);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(2500);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(700);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(900);
            const target = page.getByText('Amazon Bedrock', { exact: true }).first();
            const card = target.locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button', { name: 'Configure' }).click();
            await page.waitForTimeout(4500);
            const provider = page.getByText('Anthropic', { exact: true }).first();
            console.log('ANTHROPIC_COUNT', await page.getByText('Anthropic', { exact: true }).count());
            console.log('PROVIDER_LABELS_BEFORE', JSON.stringify(await page.locator('label').evaluateAll(els => els.map(x => x.innerText.trim()).filter(Boolean))));
            await provider.click();
            await page.waitForTimeout(1500);
            console.log('AFTER_PROVIDER_TEXT', (await page.locator('body').innerText()).slice(0, 9500));
            console.log('AFTER_PROVIDER_BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('AFTER_PROVIDER_LABELS', JSON.stringify(await page.locator('label').evaluateAll(els => els.map(x => x.innerText.trim()).filter(Boolean))));
            console.log('AFTER_PROVIDER_INPUTS', JSON.stringify(await page.locator('input').evaluateAll(els => els.filter(x => x.type === 'checkbox').map(x => ({id:x.id,checked:x.checked,disabled:x.disabled,label:x.getAttribute('aria-labelledby') ? document.getElementById(x.getAttribute('aria-labelledby'))?.innerText : ''})))));
          } finally {
            await browser.close();
          }
          JS
