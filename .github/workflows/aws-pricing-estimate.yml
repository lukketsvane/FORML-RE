name: AWS Pricing Calculator support-services estimate

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-support-estimate
  cancel-in-progress: true

jobs:
  inspect-lambda:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Inspect Lambda calculator form
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(12000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1100);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(600);
            const search=page.getByRole('searchbox',{name:'Find Service'});
            await search.fill('AWS Lambda');
            await page.waitForTimeout(900);
            const card=page.getByText('AWS Lambda',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            console.log('LAMBDA_CARD', (await card.innerText()).slice(0,800));
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(3500);
            console.log('FORM_URL',page.url());
            console.log('FORM_TEXT',(await page.locator('body').innerText()).slice(-15000));
            console.log('FORM_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('FORM_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(es=>es.map(e=>({type:e.type,aria:e.getAttribute('aria-label'),placeholder:e.placeholder,value:e.value,checked:e.checked,disabled:e.disabled,outer:e.outerHTML.slice(0,450)})))));
            console.log('FORM_SELECTS',JSON.stringify(await page.locator('select').evaluateAll(es=>es.map(e=>({aria:e.getAttribute('aria-label'),value:e.value,options:[...e.options].map(o=>({text:o.text,value:o.value})).slice(0,80)})))));
            console.log('FORM_COMBOBOXES',JSON.stringify(await page.getByRole('combobox').evaluateAll(es=>es.map(e=>({text:e.innerText,aria:e.getAttribute('aria-label'),outer:e.outerHTML.slice(0,800)})))));
          } finally {await browser.close();}
          JS
