name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Inspect Fable 5.1 calculator configuration
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1200);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(500);
            const card = page.getByText('Amazon Bedrock', { exact: true }).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button', { name: 'Configure' }).click();
            await page.waitForTimeout(2500);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs => {
              for (const i of inputs) {
                const id=i.getAttribute('aria-labelledby');
                const label=id?document.getElementById(id)?.innerText.trim():'';
                if (label==='AI21 Labs' && i.checked) i.click();
                if (label==='Anthropic' && !i.checked) i.click();
              }
            });
            await page.waitForTimeout(900);
            const modelButton = page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first();
            await modelButton.click();
            await page.waitForTimeout(500);
            const opt = page.locator('[role="option"]').filter({hasText:'Anthropic: Claude Fable 5.1'}).first();
            console.log('FABLE_51_OPTION_COUNT', await opt.count());
            await opt.click();
            await page.waitForTimeout(1500);
            console.log('FABLE_SELECTED_BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('FORM_TEXT', (await page.locator('body').innerText()).slice(-14000));
            console.log('MODEL_FIELDS', JSON.stringify(await page.locator('input[type="text"]').evaluateAll(els => els.map((x,i) => {
              const lab = x.getAttribute('aria-label') || (x.id ? document.querySelector('label[for="'+x.id+'"]')?.innerText : '') || '';
              const row = x.closest('[class*="form-field"],[class*="formField"],[class*="field"]');
              return {i,aria:lab,placeholder:x.placeholder,value:x.value,disabled:x.disabled,outer:x.outerHTML.slice(0,400),rowText:(row?.innerText||'').slice(0,400)};
            }).filter(x=>x.aria || /tokens|requests|hours/i.test(x.rowText)))));
            console.log('CALCULATED_TOTALS', (await page.locator('body').innerText()).split('\n').filter(x=>/Total (Monthly|Upfront)|USD/.test(x)).slice(-15));
          } finally { await browser.close(); }
          JS
