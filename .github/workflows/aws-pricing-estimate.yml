name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Inspect Anthropic model catalogue
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(25000);
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.method(), req.url(), req.failure()?.errorText));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(3500);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(2500);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(500);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(800);
            const card = page.getByText('Amazon Bedrock', { exact: true }).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button', { name: 'Configure' }).click();
            await page.waitForTimeout(4500);
            const providerChecks = await page.locator('input[type="checkbox"]').evaluateAll(inputs => inputs.map(i => ({
              id:i.id, checked:i.checked, disabled:i.disabled,
              label:i.getAttribute('aria-labelledby') ? document.getElementById(i.getAttribute('aria-labelledby'))?.innerText.trim() : ''
            })).filter(x => ['AI21 Labs','Anthropic'].includes(x.label)));
            console.log('PROVIDER_CHECKS', JSON.stringify(providerChecks));
            for (const check of providerChecks) {
              const locator = page.locator('input[id="' + check.id + '"]');
              if (check.label === 'AI21 Labs' && check.checked) await locator.uncheck({ force:true });
              if (check.label === 'Anthropic' && !check.checked) await locator.check({ force:true });
            }
            await page.waitForTimeout(1500);
            console.log('ANTHROPIC_MODEL_BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            const modelButton = page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first();
            console.log('MODEL_SELECTOR_COUNT', await modelButton.count());
            await modelButton.click();
            await page.waitForTimeout(1200);
            console.log('MODEL_MENU_TEXT', (await page.locator('body').innerText()).slice(-12000));
            console.log('MODEL_OPTIONS', JSON.stringify(await page.locator('[role="option"]').evaluateAll(els => els.map(x => x.innerText.trim()))));
            console.log('FABLE_VISIBLE', await page.getByText(/Fable/i).count());
          } finally {
            await browser.close();
          }
          JS
