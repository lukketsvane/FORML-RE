name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Inspect Bedrock service configuration
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(25000);
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.method(), req.url(), req.failure()?.errorText));
            page.on('pageerror', err => console.log('PAGE_ERROR', err.message));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(4000);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(4000);
            const target = page.getByText('Amazon Bedrock', { exact: true }).first();
            console.log('BEDROCK_ANCESTORS', JSON.stringify(await target.evaluate(el => {
              const out = [];
              let n = el;
              for (let i = 0; n && i < 7; i++, n = n.parentElement) {
                out.push({ tag: n.tagName, cls: String(n.className).slice(0, 180), role: n.getAttribute('role'), text: (n.innerText || '').slice(0, 500), html: n.outerHTML.slice(0, 1800) });
              }
              return out;
            })));
            console.log('REGION_BUTTONS', JSON.stringify((await page.getByRole('button').allTextContents()).slice(0, 12)));
            const regionButtons = page.getByRole('button', { name: 'US East (Ohio)' });
            console.log('OHIO_REGION_COUNT', await regionButtons.count());
            console.log('CURRENT_URL', page.url());
          } finally {
            await browser.close();
          }
          JS
