name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-public-estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Build and save Bedrock workload estimate
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(12000);
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1200);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(500);
            const card=page.getByText('Amazon Bedrock',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2200);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){const id=i.getAttribute('aria-labelledby');const label=id?document.getElementById(id)?.innerText.trim():'';if(label==='AI21 Labs'&&i.checked)i.click();if(label==='Anthropic'&&!i.checked)i.click();}
            });
            await page.waitForTimeout(700);
            await page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first().click();
            await page.waitForTimeout(400);
            await page.locator('[role="option"]').filter({hasText:'Anthropic: Claude Fable 5.1'}).first().click();
            await page.waitForTimeout(800);
            await page.getByLabel('Description - optional').fill('FORMLÆRE — 6-month research benchmark. Calculator uses Claude Fable 5.1 Global as a conservative pricing proxy because Fable 5.2 is not yet in the calculator catalogue. The actual Fable 5.2 US-geo Bedrock offer ($8.80/M input; $44/M output) is documented separately; 400M input + 10M output = $3,960.');
            const req=page.locator('input[aria-label="Average requests per minute"]:visible').first();
            const hours=page.locator('input[aria-label="Hours per day at this rate"]:visible').first();
            const inp=page.locator('input[aria-label="Average input tokens per request"]:visible').first();
            const out=page.locator('input[aria-label="Average output tokens per request"]:visible').first();
            console.log('VISIBLE_INPUT_COUNTS',JSON.stringify({req:await req.count(),hours:await hours.count(),input:await inp.count(),output:await out.count()}));
            await req.fill('1.1574074');
            await hours.fill('8');
            await inp.fill('4000');
            await out.fill('100');
            await out.press('Tab');
            await page.waitForTimeout(1800);
            console.log('ENTERED_VALUES',JSON.stringify({req:await req.inputValue(),hours:await hours.inputValue(),input:await inp.inputValue(),output:await out.inputValue()}));
            console.log('BEDROCK_COST_LINES',(await page.locator('body').innerText()).split('\n').filter(x=>/Total (Monthly|Upfront)|USD/.test(x)).slice(-12));
            console.log('ESTIMATE_FORM_TEXT',(await page.locator('body').innerText()).slice(-2500));
            await page.getByRole('button',{name:'Save and view summary',exact:true}).click();
            await page.waitForTimeout(2500);
            console.log('SUMMARY_URL',page.url());
            console.log('SUMMARY_TEXT',(await page.locator('body').innerText()).slice(-12000));
            console.log('SUMMARY_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('SUMMARY_LINKS',JSON.stringify(await page.locator('a').evaluateAll(els=>els.map(a=>({text:a.innerText.trim(),href:a.href})).filter(x=>x.text||x.href).slice(-60))));
          }finally{await browser.close();}
          JS
