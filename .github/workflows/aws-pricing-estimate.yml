name: AWS Pricing Calculator browser helper

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-pricing-estimate-helper-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-public-calculator:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Open Anthropic model dropdown
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(3000);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1500);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(400);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(600);
            const card = page.getByText('Amazon Bedrock', { exact: true }).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button', { name: 'Configure' }).click();
            await page.waitForTimeout(3000);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs => {
              for (const i of inputs) {
                const id=i.getAttribute('aria-labelledby');
                const label=id?document.getElementById(id)?.innerText.trim():'';
                if (label==='AI21 Labs' && i.checked) i.click();
                if (label==='Anthropic' && !i.checked) i.click();
              }
            });
            await page.waitForTimeout(900);
            const matches = await page.getByRole('button').evaluateAll(bs => bs.map((b,i) => ({
              i, text:(b.innerText||'').trim(), aria:b.getAttribute('aria-label'),
              title:b.getAttribute('title'), labelledby:b.getAttribute('aria-labelledby'),
              html:b.outerHTML.slice(0,1200)
            })).filter(x=>x.text.includes('Anthropic: Claude')));
            console.log('MODEL_BUTTON_DETAILS', JSON.stringify(matches));
            if (matches.length) {
              const modelIndex=matches[0].i;
              try { await page.getByRole('button').nth(modelIndex).click({timeout:5000}); console.log('MODEL_FIRST_BUTTON_CLICKED',true); }
              catch(e) { console.log('MODEL_FIRST_BUTTON_ERROR',e.message); }
            }
            await page.waitForTimeout(800);
            console.log('FABLE_VISIBLE', await page.getByText(/Fable/i).count());
            console.log('MODEL_OPTIONS', JSON.stringify(await page.locator('[role="option"],[role="menuitem"]').evaluateAll(els=>els.map(x=>x.innerText.trim()))));
            console.log('MODEL_DROPDOWN_TEXT', (await page.locator('body').innerText()).slice(-12000));
            await page.keyboard.press('Escape');
            const globalButtons = await page.getByRole('button').evaluateAll(bs => bs.map((b,i)=>({i,text:(b.innerText||'').trim()})).filter(x=>x.text==='Global'));
            console.log('GLOBAL_ROUTE_BUTTONS', JSON.stringify(globalButtons));
            if (globalButtons.length) {
              await page.getByRole('button').nth(globalButtons[0].i).click();
              await page.waitForTimeout(500);
              console.log('ROUTE_MENU_OPTIONS', JSON.stringify(await page.locator('[role="option"],[role="menuitem"]').evaluateAll(els=>els.map(x=>x.innerText.trim()))));
              console.log('ROUTE_MENU_TAIL', (await page.locator('body').innerText()).slice(-5000));
              const inRegion = page.getByText('In Region',{exact:true});
              console.log('IN_REGION_TEXT_COUNT', await inRegion.count());
              if (await inRegion.count()) {
                await inRegion.last().click();
                await page.waitForTimeout(900);
                const modelBtns = await page.getByRole('button').evaluateAll(bs=>bs.map((b,i)=>({i,text:(b.innerText||'').trim()})).filter(x=>x.text.includes('Anthropic: Claude')));
                console.log('IN_REGION_MODEL_BUTTONS', JSON.stringify(modelBtns));
                if (modelBtns.length) {
                  await page.getByRole('button').nth(modelBtns[0].i).click();
                  await page.waitForTimeout(700);
                  console.log('IN_REGION_MODEL_OPTIONS', JSON.stringify(await page.locator('[role="option"],[role="menuitem"]').evaluateAll(els=>els.map(x=>x.innerText.trim()))));
                  console.log('IN_REGION_FABLE_TEXT', (await page.locator('body').innerText()).slice(-7000));
                  console.log('IN_REGION_FABLE_52_COUNT', await page.getByText(/Fable 5\\.2/i).count());
                }
              }
            }
          } finally { await browser.close(); }
          JS
