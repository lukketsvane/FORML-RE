name: AWS Pricing Calculator support-services estimate

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-support-estimate
  cancel-in-progress: true

jobs:
  configure-lambda:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Configure six-month Lambda workload
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(15000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1000);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(500);
            await page.getByRole('searchbox',{name:'Find Service'}).fill('AWS Lambda');
            await page.waitForTimeout(800);
            const card=page.getByText('AWS Lambda',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1800);
            await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').check({force:true});
            await page.waitForTimeout(300);
            console.log('LAMBDA_TIER_STATE',JSON.stringify({
              without:await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').isChecked(),
              with:await page.locator('input[type="radio"][value="lambdaWithFreeTier"]').isChecked()
            }));
            await page.locator('input[aria-label="Number of requests Value"]:visible').first().fill('166667');
            await page.locator('input[aria-label^="Duration of each request"]:visible').first().fill('20000');
            await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().fill('1024');
            await page.getByLabel('Description - optional').fill('Six-month FORMLÆRE benchmark: average 166,667 invocations/month, 20 seconds each, 1,024 MB, excluding Free Tier. Six-month workload ≈20 million GB-seconds.');
            await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().press('Tab');
            await page.waitForTimeout(1200);
            const text=await page.locator('body').innerText();
            console.log('LAMBDA_INPUTS',JSON.stringify({
              requests:await page.locator('input[aria-label="Number of requests Value"]:visible').first().inputValue(),
              duration:await page.locator('input[aria-label^="Duration of each request"]:visible').first().inputValue(),
              memory:await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().inputValue(),
              freeTier:await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').isChecked()
            }));
            console.log('LAMBDA_COST_TEXT',text.split('\n').filter(x=>/Total Monthly|Total Upfront|USD|Free Tier|per month/.test(x)).slice(-18));
            console.log('LAMBDA_ERRORS',text.split('\n').filter(x=>/error|invalid|required|cannot be/i.test(x)).slice(-15));
            await page.getByRole('button',{name:'Save and add service',exact:true}).click();
            await page.waitForTimeout(1800);
            console.log('NEXT_PAGE_URL',page.url());
            console.log('NEXT_PAGE_TEXT',(await page.locator('body').innerText()).slice(-3500));
            console.log('NEXT_PAGE_BUTTONS',JSON.stringify((await page.getByRole('button').allTextContents()).slice(0,25)));
            await page.getByRole('searchbox',{name:'Find Service'}).fill('Amazon S3');
            await page.waitForTimeout(700);
            await page.getByRole('searchbox',{name:'Find Service'}).fill('S3');
            await page.waitForTimeout(900);

            const s3card=page.getByText('Amazon Simple Storage Service (S3)',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            console.log('S3_CARD_TEXT',(await s3card.innerText()).slice(0,600));
            await s3card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2800);
            console.log('S3_FORM_URL',page.url());
            console.log('S3_FORM_TEXT',(await page.locator('body').innerText()).slice(-12000));
            console.log('S3_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(es=>es.map(e=>({type:e.type,aria:e.getAttribute('aria-label'),placeholder:e.placeholder,value:e.value,checked:e.checked,disabled:e.disabled,outer:e.outerHTML.slice(0,350)})))));
            console.log('S3_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            await page.getByLabel('Description - optional').fill('Six-month FORMLÆRE project: 100 GB S3 Standard storage held for six months, represented as 50 GB/month over the calculator 12-month horizon; modest metadata and evaluation input/output requests.');
            await page.locator('input[aria-label="S3 Standard storage Value"]:visible').first().fill('50');
            await page.locator('input[aria-label^="PUT, COPY, POST, LIST requests to S3 Standard"]:visible').first().fill('500');
            await page.locator('input[aria-label^="GET, SELECT, and all other requests from S3 Standard"]:visible').first().fill('5000');
            await page.locator('input[aria-label^="GET, SELECT, and all other requests from S3 Standard"]:visible').first().press('Tab');
            await page.waitForTimeout(1200);
            const s3text=await page.locator('body').innerText();
            console.log('S3_ENTERED',JSON.stringify({
              storage:await page.locator('input[aria-label="S3 Standard storage Value"]:visible').first().inputValue(),
              put:await page.locator('input[aria-label^="PUT, COPY, POST, LIST requests to S3 Standard"]:visible').first().inputValue(),
              get:await page.locator('input[aria-label^="GET, SELECT, and all other requests from S3 Standard"]:visible').first().inputValue()
            }));
            console.log('S3_COST_LINES',s3text.split('\n').filter(x=>/Monthly cost|Upfront cost|USD|Total 12 months/.test(x)).slice(-10));
            console.log('S3_ERRORS',s3text.split('\n').filter(x=>/error|invalid|required|cannot be/i.test(x)).slice(-10));
            await page.getByRole('button',{name:'Save and add service',exact:true}).click();
            await page.waitForTimeout(1100);
            await page.getByRole('searchbox',{name:'Find Service'}).fill('AWS Step Functions');
            await page.waitForTimeout(700);
            const sfText=page.getByText('AWS Step Functions',{exact:true}).first();
            console.log('STEP_FUNCTIONS_TITLE_COUNT',await sfText.count());
            const sfcard=sfText.locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await sfcard.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2400);
            console.log('STEP_FUNCTIONS_URL',page.url());
            console.log('STEP_FUNCTIONS_TEXT',(await page.locator('body').innerText()).slice(0,9000));
            console.log('STEP_FUNCTIONS_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(es=>es.map(e=>({type:e.type,aria:e.getAttribute('aria-label'),value:e.value,checked:e.checked,disabled:e.disabled,outer:e.outerHTML.slice(0,300)})).filter(x=>x.aria&&!['Description - optional'].includes(x.aria)))));

          }finally{await browser.close();}
          JS
