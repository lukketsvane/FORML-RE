name: AWS Pricing Calculator combined share estimate
on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-share.yml
permissions:
  contents: read
concurrency:
  group: aws-pricing-share-${{ github.sha }}
  cancel-in-progress: true
jobs:
  share-combined-estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Create combined estimate and open sharing dialog
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(12000);
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1000);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);

            // Amazon Bedrock, with Fable 5.1 Global only as the explicit conservative calculator proxy.
            let card=page.getByText('Amazon Bedrock',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2000);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){const id=i.getAttribute('aria-labelledby');const label=id?document.getElementById(id)?.innerText.trim():'';if(label==='AI21 Labs'&&i.checked)i.click();if(label==='Anthropic'&&!i.checked)i.click();}
            });
            await page.waitForTimeout(600);
            await page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first().click();
            await page.waitForTimeout(350);
            await page.locator('[role="option"]').filter({hasText:'Anthropic: Claude Fable 5.1'}).first().click();
            await page.waitForTimeout(650);
            await page.getByLabel('Description - optional').fill('FORMLÆRE — 6-month research benchmark. AWS Pricing Calculator currently lists Fable 5.1 Global; used here as a conservative proxy, not a substitute claim for Fable 5.2. Actual intended Fable 5.2 US-geo Bedrock offer: $8.80/M input and $44/M output; 400M input + 10M output = $3,960 over six months.');
            await page.locator('input[aria-label="Average requests per minute"]:visible').first().fill('1');
            await page.locator('input[aria-label="Hours per day at this rate"]:visible').first().fill('8');
            await page.locator('input[aria-label="Average input tokens per request"]:visible').first().fill('4629');
            await page.locator('input[aria-label="Average output tokens per request"]:visible').first().fill('116');
            await page.locator('input[aria-label="Average output tokens per request"]:visible').first().press('Tab');
            await page.waitForTimeout(700);
            console.log('BEDROCK_TOTALS',(await page.locator('body').innerText()).split('\n').filter(x=>/Total Monthly|Total Upfront/.test(x)).slice(-4));
            await page.getByRole('button',{name:'Save and add service',exact:true}).click();
            await page.waitForURL(/addService/,{timeout:20000});
            await page.waitForTimeout(800);

            // Lambda: six-month workload ≈20 million GB-seconds.
            await page.getByRole('searchbox',{name:'Find Service'}).fill('AWS Lambda');
            await page.waitForTimeout(700);
            card=page.locator('li').filter({hasText:'AWS Lambda'}).first();
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1500);
            await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').check({force:true});
            await page.locator('input[aria-label="Number of requests Value"]:visible').first().fill('166667');
            await page.locator('input[aria-label^="Duration of each request"]:visible').first().fill('20000');
            await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().fill('1024');
            await page.getByLabel('Description - optional').fill('Six-month benchmark: 166,667 invocations/month × 20 seconds × 1,024 MB ≈20 million GB-seconds; free tier excluded.');
            await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().press('Tab');
            await page.waitForTimeout(700);
            console.log('LAMBDA_TOTALS',(await page.locator('body').innerText()).split('\n').filter(x=>/Total Monthly|Total Upfront/.test(x)).slice(-4));
            await page.getByRole('button',{name:'Save and add service',exact:true}).click();
            await page.waitForURL(/addService/,{timeout:20000});
            await page.waitForTimeout(700);

            // S3 Standard: 100GB storage; no additional data transfer assumptions.
            await page.getByRole('searchbox',{name:'Find Service'}).fill('S3');
            await page.waitForTimeout(800);
            card=page.locator('li').filter({hasText:'Amazon Simple Storage Service (S3)'}).first();
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1800);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){const label=i.parentElement?.parentElement?.innerText.trim()||'';if(/S3 Standard/.test(label)&&!i.checked)i.click();}
            });
            const storage=page.locator('input[aria-label="S3 Standard storage Value"]:visible').first();
            await storage.fill('100');
            await page.getByLabel('Description - optional').fill('Research corpus and benchmark artefacts: 100GB S3 Standard storage held during project; data transfer and request costs not assumed here.');
            await storage.press('Tab');
            await page.waitForTimeout(800);
            console.log('S3_STORAGE_VALUE',await storage.inputValue());
            console.log('S3_TOTALS',(await page.locator('body').innerText()).split('\n').filter(x=>/Total Monthly|Total Upfront|USD/.test(x)).slice(-10));
            console.log('S3_ERRORS',(await page.locator('body').innerText()).split('\n').filter(x=>/error|invalid|required|cannot be/i.test(x)).slice(-10));
            await page.getByRole('button',{name:'Save and view summary',exact:true}).click();
            await page.waitForURL(/estimate/,{timeout:25000});
            await page.waitForTimeout(1800);
            console.log('FINAL_SUMMARY_URL',page.url());
            console.log('FINAL_SUMMARY_TEXT',(await page.locator('body').innerText()).slice(-12000));
            console.log('FINAL_SUMMARY_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            await page.getByRole('button',{name:'Share',exact:true}).click();
            await page.waitForTimeout(1200);
            console.log('SHARE_DIALOG_TEXT',(await page.locator('body').innerText()).slice(-9000));
            console.log('SHARE_DIALOG_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('SHARE_DIALOG_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map(x=>({aria:x.getAttribute('aria-label'),value:x.value,placeholder:x.placeholder,type:x.type,visible:!!x.offsetParent})).filter(x=>x.visible))));
            await page.getByRole('button',{name:'Agree and continue',exact:true}).click();
            await page.waitForTimeout(1500);
            console.log('SHARE_AFTER_CONSENT_TEXT',(await page.locator('body').innerText()).slice(-9000));
            console.log('SHARE_AFTER_CONSENT_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('SHARE_AFTER_CONSENT_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map(x=>({aria:x.getAttribute('aria-label'),value:x.value,placeholder:x.placeholder,type:x.type,readonly:x.readOnly,visible:!!x.offsetParent})).filter(x=>x.visible))));
            console.log('SHARE_LINKS',JSON.stringify(await page.locator('a').evaluateAll(els=>els.map(a=>({text:a.innerText.trim(),href:a.href})).filter(x=>x.href.includes('calculator.aws')||x.text.toLowerCase().includes('copy')))));
            try {
              await page.context().grantPermissions(['clipboard-read','clipboard-write']);
              console.log('CLIPBOARD_TEXT',await page.evaluate(async()=>await navigator.clipboard.readText()));
            } catch(e) { console.log('CLIPBOARD_READ_ERROR',e.message); }

          }finally{await browser.close();}
          JS
