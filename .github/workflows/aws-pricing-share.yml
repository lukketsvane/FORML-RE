name: AWS Pricing Calculator combined estimate helper
on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-pricing-share.yml
permissions:
  contents: read
concurrency:
  group: aws-pricing-share-${{ github.sha }}
  cancel-in-progress: true
jobs:
  inspect-s3-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Configure Bedrock and Lambda then inspect S3 fields
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(12000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2000);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(900);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);
            let card=page.getByText('Amazon Bedrock',{exact:true}).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2000);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){const id=i.getAttribute('aria-labelledby');const label=id?document.getElementById(id)?.innerText.trim():'';if(label==='AI21 Labs'&&i.checked)i.click();if(label==='Anthropic'&&!i.checked)i.click();}
            });
            await page.waitForTimeout(600);
            await page.getByRole('button').filter({hasText:'Anthropic: Claude Haiku 4.5'}).first().click();
            await page.waitForTimeout(350);
            await page.locator('[role="option"]').filter({hasText:'Anthropic: Claude Fable 5.1'}).first().click();
            await page.waitForTimeout(650);
            await page.getByLabel('Description - optional').fill('FORMLÆRE — 6-month research benchmark. Pricing Calculator lists Fable 5.1 Global as a conservative proxy; actual Fable 5.2 US-geo rates $8.80/M input and $44/M output; 400M + 10M tokens = $3,960.');
            await page.locator('input[aria-label="Average requests per minute"]:visible').first().fill('1');
            await page.locator('input[aria-label="Hours per day at this rate"]:visible').first().fill('8');
            await page.locator('input[aria-label="Average input tokens per request"]:visible').first().fill('4629');
            await page.locator('input[aria-label="Average output tokens per request"]:visible').first().fill('116');
            await page.locator('input[aria-label="Average output tokens per request"]:visible').first().press('Tab');
            await page.waitForTimeout(800);
            await page.getByRole('button',{name:'Save and add service',exact:true}).click();
            await page.waitForURL(/addService/,{timeout:20000});
            await page.waitForTimeout(1000);
            await page.getByRole('searchbox',{name:'Find Service'}).fill('AWS Lambda');
            await page.waitForTimeout(750);
            card=page.locator('li').filter({hasText:'AWS Lambda'}).first();
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1600);
            await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').check({force:true});
            await page.locator('input[aria-label="Number of requests Value"]:visible').first().fill('166667');
            await page.locator('input[aria-label^="Duration of each request"]:visible').first().fill('20000');
            await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().fill('1024');
            await page.getByLabel('Description - optional').fill('Six-month benchmark: 166,667 requests/month × 20 seconds × 1,024 MB ≈ 20 million GB-seconds; free tier excluded.');
            await page.locator('input[aria-label="Amount of memory allocated Value"]:visible').first().press('Tab');
            await page.waitForTimeout(700);
            console.log('LAMBDA_COST',(await page.locator('body').innerText()).split('\n').filter(x=>/Total Monthly|Total Upfront/.test(x)).slice(-4));
            await page.getByRole('button',{name:'Save and add service',exact:true}).click();
            await page.waitForURL(/addService/,{timeout:20000});
            await page.waitForTimeout(700);
            await page.getByRole('searchbox',{name:'Find Service'}).fill('S3');
            await page.waitForTimeout(900);
            card=page.locator('li').filter({hasText:'Amazon Simple Storage Service (S3)'}).first();
            await card.getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(2000);
            console.log('S3_CONFIG_TEXT',(await page.locator('body').innerText()).slice(-14000));
            console.log('S3_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map((x,i)=>({i,aria:x.getAttribute('aria-label'),placeholder:x.placeholder,value:x.value,type:x.type,disabled:x.disabled,visible:!!x.offsetParent})).filter(x=>x.visible))));
            console.log('S3_INPUT_LAYOUT',JSON.stringify(await page.locator('input:visible').evaluateAll(els=>els.map((x,i)=>{
              const chain=[];let p=x;for(let k=0;p&&k<7;k++,p=p.parentElement)chain.push({tag:p.tagName,cls:String(p.className).slice(0,80),text:(p.innerText||'').trim().slice(0,500)});
              const id=x.id;const labels=id?[...document.querySelectorAll('label[for="'+id+'"]')].map(l=>l.innerText.trim()):[];
              return {i,aria:x.getAttribute('aria-label'),type:x.type,value:x.value,labels,chain};
            }))));
            console.log('S3_CHECKBOX_LABELS',JSON.stringify(await page.locator('input[type="checkbox"]:visible').evaluateAll(els=>els.map((x,i)=>{
              const id=x.id;const labels=id?[...document.querySelectorAll('label[for="'+id+'"]')].map(l=>l.innerText.trim()):[];
              return {i,checked:x.checked,labels,near:(x.parentElement?.innerText||'').trim().slice(0,300),grand:(x.parentElement?.parentElement?.innerText||'').trim().slice(0,400)};
            }))));
            console.log('S3_SELECTS',JSON.stringify(await page.locator('select').evaluateAll(els=>els.map(x=>({aria:x.getAttribute('aria-label'),value:x.value,options:[...x.options].map(o=>o.text)})))));
            console.log('S3_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
          }finally{await browser.close();}
          JS
