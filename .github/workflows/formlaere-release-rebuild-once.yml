name: FORMLÆRE release rebuild once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/formlaere-release-rebuild-once.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: traktat
        shell: bash
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traktat/requirements-build.txt
      - name: Install pinned Python dependencies
        run: python3 -m pip install -r requirements-build.txt
      - name: Install the TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-european \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2 pandoc
      - name: Build the complete edition
        run: make all
      - name: Verify the generated print release
        run: make check-generated
      - name: Commit the regenerated print release
        run: |
          git -C .. config user.name "github-actions[bot]"
          git -C .. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .. add traktat/pdf/formlaere.pdf traktat/pdf/formlaere-latex.zip traktat/pdf/release.json
          if git -C .. diff --cached --quiet; then
            echo "Print release is already current."
          else
            git -C .. commit -m "Refresh generated FORMLÆRE print release [skip ci]"
            git -C .. push origin HEAD:main
          fi
