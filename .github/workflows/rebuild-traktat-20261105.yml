name: Rebuild FORMLÆRE editorial release
on:
  push:
    branches:
      - edit/whole-tractate-20261105
    paths:
      - 'traktat/tekst/formlaere.tex'
      - 'traktat/nettstad/reader.css'
      - 'traktat/nettstad/reader.html'
      - 'traktat/figurar.json'
      - '.github/workflows/rebuild-traktat-20261105.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traktat/requirements-build.txt
      - name: Install Python dependencies
        run: python3 -m pip install -r traktat/requirements-build.txt
      - name: Install print tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-european \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2 pandoc
      - name: Build full print and web release
        run: |
          cd traktat
          make all
          make check-generated
      - name: Commit immutable outputs with the canonical source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traktat/pdf/formlaere.pdf traktat/pdf/formlaere-latex.zip traktat/pdf/release.json traktat/nettstad/kortversjon.html
          if ! git diff --cached --quiet; then
            git commit -m "Bygg heilskapsrevidert formlære i PDF og nettutgåve"
            git push origin HEAD:refs/heads/edit/whole-tractate-20261105
          fi
