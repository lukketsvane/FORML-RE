name: Rebuild FORMLÆRE revision release
on:
  push:
    branches:
      - revision/394-proposisjonar-web-20261110
    paths:
      - 'traktat/tekst/formlaere.tex'
      - 'traktat/figurar.json'
      - '.github/workflows/rebuild-394-revision.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traktat/requirements-build.txt
      - run: python3 -m pip install -r traktat/requirements-build.txt
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-european \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2 pandoc
      - name: Build the complete revision release
        run: |
          cd traktat
          make all
          make check-generated
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traktat/pdf/formlaere.pdf \
                  traktat/pdf/formlaere-latex.zip \
                  traktat/pdf/release.json \
                  traktat/nettstad/kortversjon.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate FORMLÆRE revision print release"
            git push origin HEAD:refs/heads/revision/394-proposisjonar-web-20261110
          fi
