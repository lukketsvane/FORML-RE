name: Enrich public AWS research estimate

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-estimate-enrich.yml

permissions:
  contents: read

concurrency:
  group: aws-estimate-enrich-${{ github.sha }}
  cancel-in-progress: true

jobs:
  enrich-and-verify-share:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Add Step Functions, DynamoDB, and CloudWatch to the saved estimate
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const shareUrl = 'https://calculator.aws/#/estimate?id=4700bbb8eb1ca43294d6d76131f1ab0b3dbb14ff';
          const browser = await chromium.launch({headless:true});
          try {
            const page = await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(15000);
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message));
            page.on('requestfailed',r=>console.log('REQUEST_FAILED',r.method(),r.url(),r.failure()?.errorText));
            await page.goto(shareUrl,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2500);
            console.log('OPEN_EXISTING_URL',page.url());
            console.log('EXISTING_SUMMARY',(await page.locator('body').innerText()).slice(-5000));
            const add=page.getByRole('button',{name:'Add service',exact:true});
            console.log('ADD_SERVICE_COUNT',await add.count());
            await add.click();
            await page.waitForURL(/addService/,{timeout:25000});
            await page.waitForTimeout(800);

            async function addService(query,pattern,key,fillFields,beforeSave){
              await page.locator('input[placeholder="Search for a service"]').fill(query);
              await page.waitForTimeout(650);
              const cards=await page.locator('li').evaluateAll((els,p)=>els.map((el,i)=>({i,text:(el.innerText||'').trim()})).filter(x=>new RegExp(p,'i').test(x.text)),pattern);
              console.log(key+'_CARDS',JSON.stringify(cards.slice(0,5)));
              if(!cards.length)throw new Error('Service not found: '+query);
              await page.locator('li').nth(cards[0].i).getByRole('button',{name:'Configure'}).click();
              await page.waitForTimeout(1600);
              if(beforeSave)await beforeSave();
              for(const [selector,value] of fillFields){
                const loc=page.locator(selector).first();
                const n=await loc.count();
                if(n!==1)throw new Error(key+' missing '+selector+' ('+n+')');
                await loc.fill(String(value));
              }
              await page.waitForTimeout(350);
              console.log(key+'_TOTALS',(await page.locator('body').innerText()).split('\n').filter(x=>/Total (Monthly|Upfront)/.test(x)).slice(-4));
              await page.getByRole('button',{name:'Save and add service',exact:true}).click();
              await page.waitForURL(/addService/,{timeout:20000});
              await page.waitForTimeout(500);
            }

            await addService('Step Functions','^AWS Step Functions','STEP',[
              ['input[aria-label="Workflow requests Value"]:visible',10000],
              ['input[aria-label^="State transitions per workflow"]:visible',8]
            ]);

            await addService('DynamoDB','^Amazon DynamoDB','DDB',[
              ['input[aria-label="Data storage size Value"]:visible',2],
              ['input[aria-label="Number of writes Value"]:visible',0.1],
              ['input[aria-label="Number of reads Value"]:visible',0.5]
            ],async()=>{
              await page.locator('input[type="checkbox"]').evaluateAll(els=>{
                for(const i of els){
                  const id=i.getAttribute('aria-labelledby');
                  const label=id?document.getElementById(id)?.innerText.trim():'';
                  if(label==='DynamoDB on-demand capacity'&&!i.checked)i.click();
                  if(label==='DynamoDB provisioned capacity'&&i.checked)i.click();
                }
              });
              await page.waitForTimeout(500);
            });

            await addService('CloudWatch','^Amazon CloudWatch','CW',[
              ['input[aria-label^="Number of Metrics (includes detailed and custom metrics)"]:visible',5],
              ['input[aria-label^="Number of other API requests"]:visible',10000],
              ['input[aria-label="Standard Logs: Data Ingested Value"]:visible',1]
            ],async()=>{
              const logs=page.locator('[role="button"][aria-controls]').filter({hasText:/^Logs/}).first();
              await logs.click();
              await page.waitForTimeout(450);
            });

            console.log('ALL_ADDED_URL',page.url());
            console.log('PRE_SUMMARY',(await page.locator('body').innerText()).slice(-6500));
            await page.getByRole('button',{name:'Save and view summary',exact:true}).click();
            await page.waitForURL(/estimate/,{timeout:25000});
            await page.waitForTimeout(1800);
            console.log('UPDATED_SUMMARY_URL',page.url());
            console.log('UPDATED_SUMMARY_TEXT',(await page.locator('body').innerText()).slice(-14000));
            console.log('UPDATED_SUMMARY_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            await page.getByRole('button',{name:'Share',exact:true}).click();
            await page.waitForTimeout(900);
            const consent=page.getByRole('button',{name:'Agree and continue',exact:true});
            console.log('CONSENT_COUNT',await consent.count());
            if(await consent.count())await consent.click();
            await page.waitForTimeout(900);
            console.log('SHARE_DIALOG_TEXT',(await page.locator('body').innerText()).slice(-7000));
            const urlField=page.locator('input[aria-label="Copy public link"]').first();
            console.log('PUBLIC_SHARE_URL',await urlField.inputValue());
            console.log('SHARE_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            const publicUrl=await urlField.inputValue();
            const verify=await browser.newPage({viewport:{width:1440,height:1200}});
            await verify.goto(publicUrl,{waitUntil:'domcontentloaded',timeout:90000});
            await verify.waitForTimeout(2500);
            console.log('VERIFY_PUBLIC_URL',verify.url());
            const verifiedText=await verify.locator('body').innerText();
            console.log('VERIFY_SERVICE_NAMES',JSON.stringify(['Amazon Bedrock','AWS Lambda','Amazon Simple Storage Service (S3)','AWS Step Functions','Amazon DynamoDB','Amazon CloudWatch'].map(n=>({name:n,found:verifiedText.includes(n)}))));
            console.log('VERIFY_SUMMARY_TAIL',verifiedText.slice(-7000));
          } finally {await browser.close();}
          JS
