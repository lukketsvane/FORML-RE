name: Render FORMLÆRE mathematical short edition (temporary)
on:
  push:
    branches:
      - agent/recover-tldr-20261101
permissions:
  contents: write
jobs:
  render-and-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies, Pandoc, and XeLaTeX
        run: |
          python3 -m pip install -r traktat/requirements-build.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-lang-european texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2
      - name: Render the author's LaTeX with native MathML
        run: python3 traktat/scripts/render_kortversjon.py
      - name: Rebuild and check both formats
        run: |
          cd traktat
          make all
          make check
          make check-generated
      - name: Record generated HTML and print files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traktat/nettstad/kortversjon.html traktat/pdf/formlaere.pdf traktat/pdf/formlaere-latex.zip traktat/pdf/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Render native MathML short edition and synchronize print build"
          git push origin HEAD:refs/heads/agent/recover-tldr-20261101
