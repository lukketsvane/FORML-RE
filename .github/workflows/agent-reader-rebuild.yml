name: Refresh FORMLÆRE edition for reader navigation (temporary)
on:
  push:
    branches: [agent/reader-proposition-tree-20261101]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dependencies, Pandoc and TeX
        run: |
          python3 -m pip install -r traktat/requirements-build.txt
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends pandoc texlive-xetex texlive-latex-extra texlive-lang-european texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2
      - name: Regenerate short article and synchronized edition
        run: |
          python3 traktat/scripts/render_kortversjon.py
          cd traktat
          make all
          make check
          make check-generated
      - name: Publish verified generated artifacts to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add traktat/nettstad/kortversjon.html traktat/pdf/formlaere.pdf traktat/pdf/formlaere-latex.zip traktat/pdf/release.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Regenerate short reader and print files after navigation changes"
          git push origin HEAD:refs/heads/agent/reader-proposition-tree-20261101
