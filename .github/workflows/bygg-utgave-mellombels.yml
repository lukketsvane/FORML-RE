name: Bygg utgåve (mellombels)

# Mellombels: byggjer PDF og kortversjon på Linux og lastar dei opp, fordi bygget ikkje kan køyrast rett på Windows.

on:
  push:
    branches: [stolen-i-profil]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bygg:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: traktat
        shell: bash
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-build.txt
      - run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-european \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2 pandoc
      - run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: utgave
          path: |
            traktat/pdf/
            traktat/nettstad/kortversjon.html
