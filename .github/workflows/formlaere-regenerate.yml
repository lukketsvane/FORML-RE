name: formlære – regenerate print release once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/formlaere-regenerate.yml']

permissions:
  contents: write

concurrency:
  group: formlaere-one-time-regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_DATE_EPOCH: '946684800'
      FORCE_SOURCE_DATE: '1'
    steps:
      - name: Check out exact manuscript commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traktat/requirements-build.txt

      - name: Install pinned dependencies
        run: python3 -m pip install -r traktat/requirements-build.txt

      - name: Install XeLaTeX, Pandoc and required fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-lang-european \
            texlive-fonts-recommended fonts-dejavu-core poppler-utils libcairo2 pandoc

      - name: Rebuild and validate both editions
        run: |
          cd traktat
          make all
          make check-generated

      - name: Commit regenerated print and short HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add -- traktat/nettstad/kortversjon.html traktat/pdf/formlaere.pdf traktat/pdf/formlaere-latex.zip traktat/pdf/release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild formlære PDF, LaTeX bundle and release manifest'
            git push origin HEAD:main
          else
            echo 'Generated release already matches the source.'
          fi
