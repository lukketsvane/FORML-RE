name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-service-catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Find exact supporting service names
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(2200);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1000);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(400);
            for (const [query,key] of [['S3','S3'],['DynamoDB','DDB'],['CloudWatch','CW']]) {
              await page.locator('input[placeholder="Search for a service"]').fill(query);
              await page.waitForTimeout(650);
              const matches = await page.locator('li').evaluateAll(els => els.map((el,i)=>({
                i, text:(el.innerText||'').trim().slice(0,500),
                buttons:[...el.querySelectorAll('button')].map(b=>b.innerText.trim())
              })).filter(x=>x.text && /S3|Storage|DynamoDB|CloudWatch/i.test(x.text)));
              console.log(key+'_MATCHES', JSON.stringify(matches.slice(0,30)));
            }
          } finally { await browser.close(); }
          JS
