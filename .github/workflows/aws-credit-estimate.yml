name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-builder-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-share-estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Build six-month AWS supporting-services estimate
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ permissions: ['clipboard-read','clipboard-write'] });
            const page = await context.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(15000);
            page.on('pageerror', e => console.log('PAGE_ERROR', e.message));
            page.on('requestfailed', r => console.log('REQUEST_FAILED', r.method(), r.url(), r.failure()?.errorText));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1000);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(500);

            async function configure(name, pattern, key, description, fillFields, beforeSave) {
              await page.locator('input[placeholder="Search for a service"]').fill(name);
              await page.waitForTimeout(700);
              const cards = await page.locator('li').evaluateAll((els, p) => els.map((el,i)=>({
                i, text:(el.innerText||'').trim()
              })).filter(x => new RegExp(p,'i').test(x.text)), pattern);
              console.log(key+'_CARDS', JSON.stringify(cards.slice(0,5)));
              if (!cards.length) throw new Error('Could not find service '+name);
              const card = page.locator('li').nth(cards[0].i);
              await card.getByRole('button', { name:'Configure' }).click();
              await page.waitForTimeout(1800);
              if (beforeSave) await beforeSave();
              await page.locator('input[aria-label="Description - optional"]').fill(description);
              for (const [selector,value] of fillFields) {
                const locator = page.locator(selector).first();
                if (await locator.count() !== 1) throw new Error(key+' missing input '+selector);
                await locator.fill(String(value));
              }
              await page.waitForTimeout(500);
              const body = await page.locator('body').innerText();
              console.log(key+'_INPUT_VALUES', JSON.stringify(await page.locator('input:visible').evaluateAll(els=>els.map(x=>({
                aria:x.getAttribute('aria-label'),value:x.value
              })).filter(x=>x.aria))));
              console.log(key+'_TOTALS',body.split('\n').filter(x=>/Total (Monthly|Upfront)|USD/.test(x)).slice(-8));
              console.log(key+'_VALIDATION',body.split('\n').filter(x=>/error|invalid|required|cannot be/i.test(x)).slice(-12));
              await page.getByRole('button',{name:'Save and add service',exact:true}).click();
              await page.waitForURL(/addService/, { timeout: 20000 });
              await page.waitForTimeout(500);
            }

            await configure(
              'AWS Lambda','AWS Lambda','LAMBDA',
              'FORMLÆRE six-month benchmark upper-bound execution envelope: up to 166,667 bounded worker invocations/month, 20 seconds per invocation, 1,024 MB. Free Tier excluded. Actual use will be monitored and constrained.',
              [
                ['input[aria-label="Number of requests Value"]:visible',166667],
                ['input[aria-label^="Duration of each request (in ms)"]:visible',20000],
                ['input[aria-label="Amount of memory allocated Value"]:visible',1024]
              ],
              async () => {
                await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').check({force:true});
              }
            );

            await configure(
              'AWS Step Functions','AWS Step Functions','STEP',
              'Six-month bounded workflow allowance: 2,500 Standard workflow executions/month, eight state transitions per execution.',
              [
                ['input[aria-label="Workflow requests Value"]:visible',2500],
                ['input[aria-label^="State transitions per workflow"]:visible',8]
              ]
            );

            await configure(
              'S3','Amazon Simple Storage Service','S3',
              'Six-month S3 Standard allowance: 100 GB retained throughout the project, with bounded metadata and evaluation read/write requests.',
              [
                ['input[aria-label="S3 Standard storage Value"]:visible',100],
                ['input[aria-label^="PUT, COPY, POST, LIST requests to S3 Standard"]:visible',10000],
                ['input[aria-label^="GET, SELECT, and all other requests from S3 Standard"]:visible',50000]
              ]
            );

            await configure(
              'DynamoDB','Amazon DynamoDB','DDB',
              'Six-month DynamoDB on-demand allowance: 2 GB metadata and evaluation state, approximately 100,000 writes/month and 500,000 reads/month.',
              [
                ['input[aria-label="Data storage size Value"]:visible',2],
                ['input[aria-label="Number of writes Value"]:visible',0.1],
                ['input[aria-label="Number of reads Value"]:visible',0.5]
              ],
              async () => {
                const inputs=page.locator('input[type="checkbox"]');
                await inputs.evaluateAll(els=>{
                  for(const i of els) {
                    const id=i.getAttribute('aria-labelledby');
                    const label=id?document.getElementById(id)?.innerText.trim():'';
                    if(label==='DynamoDB on-demand capacity'&&!i.checked)i.click();
                    if(label==='DynamoDB provisioned capacity'&&i.checked)i.click();
                  }
                });
                await page.waitForTimeout(700);
              }
            );

            await configure(
              'CloudWatch','Amazon CloudWatch','CW',
              'Six-month operational monitoring allowance: 15 custom metrics and 10,000 other API requests/month. Standard log ingestion, storage and queries are separately budgeted at up to USD 60 for six months.',
              [
                ['input[aria-label^="Number of Metrics (includes detailed and custom metrics)"]:visible',15],
                ['input[aria-label^="Number of other API requests"]:visible',10000]
              ]
            );

            console.log('ALL_SERVICES_ADDED',page.url());
            console.log('ADD_PAGE_BOTTOM_TEXT',(await page.locator('body').innerText()).slice(-3000));
            const addControls=await page.locator('button,[role="button"],a').evaluateAll(els=>els.map(e=>{
              return {
                tag:e.tagName,
                role:e.getAttribute('role'),
                text:(e.innerText||'').trim().replace(/\\s+/g,' '),
                aria:e.getAttribute('aria-label'),
                href:e.getAttribute('href')
              };
            }));
            console.log('ADD_PAGE_CONTROLS',JSON.stringify(addControls.filter(x=>/summary|share|estimate/i.test([x.text,x.aria,x.href].join(' ')))));
            const viewCount=await page.getByText('View summary',{exact:true}).count();
            console.log('VIEW_SUMMARY_COUNT',viewCount);
            if(!viewCount)throw new Error('View summary link not found on Add service page');
            const summaryText=page.getByText('View summary',{exact:true}).last();
            console.log('VIEW_SUMMARY_HTML',await summaryText.evaluate(e=>e.outerHTML));
            await summaryText.click();
            await page.waitForTimeout(2500);
            console.log('SUMMARY_URL',page.url());
            console.log('SUMMARY_TEXT',(await page.locator('body').innerText()).slice(-14000));
            const summaryControls=await page.locator('button,[role="button"],a').evaluateAll(els=>els.map(e=>{
              return {
                tag:e.tagName,
                role:e.getAttribute('role'),
                text:(e.innerText||'').trim().replace(/\\s+/g,' '),
                aria:e.getAttribute('aria-label'),
                href:e.getAttribute('href')
              };
            }));
            console.log('SUMMARY_CONTROLS',JSON.stringify(summaryControls.filter(x=>/share|save|estimate|copy|public/i.test([x.text,x.aria,x.href].join(' ')))));
            const shareCount=await page.locator('button,[role="button"],a').filter({hasText:/Share/i}).count();
            console.log('SHARE_CONTROL_COUNT',shareCount);
            if(shareCount) {
              await page.locator('button,[role="button"],a').filter({hasText:/Share/i}).first().click();
              await page.waitForTimeout(1000);
              console.log('SHARE_DIALOG_TEXT',(await page.locator('body').innerText()).slice(-7000));
              console.log('SHARE_DIALOG_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
              const shareInputs=await page.locator('input').evaluateAll(els=>els.map(x=>({
                aria:x.getAttribute('aria-label'),value:x.value,placeholder:x.placeholder
              })));
              console.log('SHARE_DIALOG_INPUTS',JSON.stringify(shareInputs.filter(x=>x.value||x.placeholder)));
              const shareLinks=await page.locator('a').evaluateAll(els=>els.map(a=>({
                text:a.innerText.trim(),href:a.href
              })));
              console.log('SHARE_DIALOG_LINKS',JSON.stringify(shareLinks.filter(x=>x.href.includes('calculator.aws'))));
              try {
                console.log('CLIPBOARD_TEXT',await page.evaluate(()=>navigator.clipboard.readText()));
              } catch(e) {
                console.log('CLIPBOARD_READ_ERROR',e.message);
              }
            }
          } finally {
            await browser.close();
          }
          JS
