name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-s3-diagnostic-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-s3:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Inspect S3 Standard accordion and selected storage class
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(12000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(900);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);
            await page.locator('input[placeholder="Search for a service"]').fill('S3');
            await page.waitForTimeout(700);
            const cards=await page.locator('li').evaluateAll(els=>els.map((e,i)=>({i,text:(e.innerText||'').trim()})).filter(x=>x.text.startsWith('Amazon Simple Storage Service')));
            await page.locator('li').nth(cards[0].i).getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1500);
            const storage=page.locator('input[aria-label="S3 Standard storage Value"]');
            const getState=async()=>({
              visible:await storage.isVisible(),
              offset:await storage.evaluate(x=>({offset:!!x.offsetParent,rect:x.getBoundingClientRect().toJSON(),display:getComputedStyle(x).display,visibility:getComputedStyle(x).visibility,ariaHidden:x.closest('[aria-hidden="true"]')?.outerHTML.slice(0,500)||null})),
              standardCheckboxes:await page.locator('input[type="checkbox"]').evaluateAll(es=>es.map((x,i)=>({i,checked:x.checked,label:x.getAttribute('aria-labelledby')?document.getElementById(x.getAttribute('aria-labelledby'))?.innerText.trim():x.parentElement?.innerText.trim()})).filter(x=>/S3 Standard|Data Transfer/.test(x.label||''))),
              accordions:await page.locator('[role="button"][aria-expanded][aria-controls]').evaluateAll(es=>es.map((x,i)=>({i,expanded:x.getAttribute('aria-expanded'),text:(x.innerText||'').trim().replace(/\\s+/g,' '),id:x.id,controls:x.getAttribute('aria-controls')})).filter(x=>/S3 Standard|Data Transfer/i.test(x.text)))
            });
            console.log('S3_STATE_INITIAL',JSON.stringify(await getState()));
            const accordion=page.locator('[role="button"][aria-expanded][aria-controls]').filter({hasText:'S3 Standard'}).first();
            console.log('S3_ACCORDION_COUNT',await page.locator('[role="button"][aria-expanded][aria-controls]').filter({hasText:'S3 Standard'}).count());
            await accordion.click();
            await page.waitForTimeout(900);
            console.log('S3_STATE_AFTER_ACCORDION',JSON.stringify(await getState()));
            console.log('S3_STANDARD_TEXT_COUNT',await page.getByText('S3 Standard',{exact:true}).count());
            console.log('S3_CHECKBOX_HTML',await page.getByText('S3 Standard',{exact:true}).first().evaluate(x=>x.parentElement?.parentElement?.outerHTML.slice(0,1800)));
            console.log('S3_PAGE_TEXT',(await page.locator('body').innerText()).slice(-8000));
          }finally{await browser.close();}
          JS
