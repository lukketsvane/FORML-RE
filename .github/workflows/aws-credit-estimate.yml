name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-dynamodb-on-demand:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Inspect DynamoDB on-demand inputs
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport:{width:1440,height:1200} });
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1000);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);
            await page.locator('input[placeholder="Search for a service"]').fill('DynamoDB');
            await page.waitForTimeout(600);
            const cards=await page.locator('li').evaluateAll(els=>els.map((el,i)=>({i,text:(el.innerText||'').trim()})).filter(x=>x.text.startsWith('Amazon DynamoDB')));
            console.log('DDB_CARDS',JSON.stringify(cards));
            await page.locator('li').nth(cards[0].i).getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1300);
            await page.locator('input[type="checkbox"]').evaluateAll(inputs=>{
              for(const i of inputs){
                const id=i.getAttribute('aria-labelledby');
                const label=id?document.getElementById(id)?.innerText.trim():'';
                if(label==='DynamoDB on-demand capacity'&&!i.checked)i.click();
                if(label==='DynamoDB provisioned capacity'&&i.checked)i.click();
              }
            });
            await page.waitForTimeout(800);
            console.log('DDB_ONDEMAND_TEXT',(await page.locator('body').innerText()).slice(-8000));
            console.log('DDB_ONDEMAND_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map((x,i)=>({
              i,type:x.type,aria:x.getAttribute('aria-label'),value:x.value,checked:x.checked,
              disabled:x.disabled,visible:!!x.offsetParent,
              label:x.getAttribute('aria-labelledby')?document.getElementById(x.getAttribute('aria-labelledby'))?.innerText.trim():''
            })).filter(x=>x.visible&&(x.aria||x.label||x.type==='checkbox')))));
          } finally {await browser.close();}
          JS
