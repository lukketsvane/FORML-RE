name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-cloudwatch-logs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Inspect CloudWatch logs section
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1000);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);
            await page.locator('input[placeholder="Search for a service"]').fill('CloudWatch');
            await page.waitForTimeout(600);
            const cards=await page.locator('li').evaluateAll(els=>els.map((el,i)=>({i,text:(el.innerText||'').trim()})).filter(x=>x.text.startsWith('Amazon CloudWatch')));
            await page.locator('li').nth(cards[0].i).getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1300);
            const logs=page.getByText('Logs',{exact:true});
            console.log('LOGS_COUNT',await logs.count());
            console.log('LOGS_ANCESTORS',JSON.stringify(await logs.first().evaluate(el=>{
              const out=[];let n=el;
              for(let k=0;n&&k<8;k++,n=n.parentElement)out.push({
                tag:n.tagName,role:n.getAttribute('role'),cls:String(n.className).slice(0,180),
                text:(n.innerText||'').slice(0,500),html:n.outerHTML.slice(0,1600),
                buttons:[...n.querySelectorAll('button')].map(b=>({text:b.innerText.trim(),expanded:b.getAttribute('aria-expanded'),label:b.getAttribute('aria-label')}))
              });
              return out;
            })));
            console.log('CW_BUTTONS',JSON.stringify(await page.getByRole('button').evaluateAll(bs=>bs.map((b,i)=>({i,text:(b.innerText||'').trim(),expanded:b.getAttribute('aria-expanded'),controls:b.getAttribute('aria-controls'),html:b.outerHTML.slice(0,500)})))));
            console.log('CW_LOG_INPUTS_ALL',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map((x,i)=>({
              i,aria:x.getAttribute('aria-label'),value:x.value,visible:!!x.offsetParent,rect:x.getBoundingClientRect().toJSON()
            })).filter(x=>/Logs|Ingested/i.test(x.aria||'')))));
          } finally {await browser.close();}
          JS
