name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-builder-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build-and-share-estimate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Build and share six-month estimate
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(15000);
            page.on('pageerror', e => console.log('PAGE_ERROR', e.message));
            page.on('requestfailed', r => console.log('REQUEST_FAILED', r.method(), r.url(), r.failure()?.errorText));
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1000);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(500);

            async function configure(name, pattern, key, fillFields, beforeSave) {
              await page.locator('input[placeholder="Search for a service"]').fill(name);
              await page.waitForTimeout(650);
              const cards = await page.locator('li').evaluateAll((els, p) => els.map((el,i)=>({
                i, text:(el.innerText||'').trim()
              })).filter(x => new RegExp(p,'i').test(x.text)), pattern);
              console.log(key+'_CARDS', JSON.stringify(cards.slice(0,5)));
              if (!cards.length) throw new Error('Could not find service '+name);
              await page.locator('li').nth(cards[0].i).getByRole('button', { name:'Configure' }).click();
              await page.waitForTimeout(1600);
              if (beforeSave) await beforeSave();
              for (const [selector,value] of fillFields) {
                const locator = page.locator(selector).first();
                const count = await locator.count();
                if (count !== 1) throw new Error(key+' missing input '+selector+' count='+count);
                await locator.fill(String(value));
              }
              await page.waitForTimeout(400);
              console.log(key+'_URL',page.url());
              console.log(key+'_TOTALS',(await page.locator('body').innerText()).split('\n').filter(x=>/Total (Monthly|Upfront)|USD/.test(x)).slice(-8));
              await page.getByRole('button',{name:'Save and add service',exact:true}).click();
              await page.waitForURL(/addService/, { timeout: 20000 });
              await page.waitForTimeout(500);
            }

            await configure(
              'AWS Lambda','^AWS Lambda','LAMBDA',
              [
                ['input[aria-label="Number of requests Value"]:visible',25000],
                ['input[aria-label^="Duration of each request (in ms)"]:visible',5000],
                ['input[aria-label="Amount of memory allocated Value"]:visible',1024]
              ],
              async () => {
                await page.locator('input[type="radio"][value="lambdaWithoutFreeTier"]').check({force:true});
                const description=page.locator('input[aria-label="Description - optional"]');
                await description.fill('FORMLÆRE — six-month research workload, US East (N. Virginia). Supporting services only. Amazon Bedrock Claude Fable 5.2 is costed separately at published US regional token rates because the public calculator model catalogue currently lists Fable 5 and 5.1, not 5.2.');
              }
            );

            await configure(
              'Step Functions','^AWS Step Functions','STEP',
              [
                ['input[aria-label="Workflow requests Value"]:visible',10000],
                ['input[aria-label^="State transitions per workflow"]:visible',8]
              ]
            );

            await configure(
              'S3','^Amazon Simple Storage Service','S3',
              [
                ['input[aria-label="S3 Standard storage Value"]:visible',100],
                ['input[aria-label^="PUT, COPY, POST, LIST requests to S3 Standard"]:visible',10000],
                ['input[aria-label^="GET, SELECT, and all other requests from S3 Standard"]:visible',50000]
              ]
            );

            await configure(
              'DynamoDB','^Amazon DynamoDB','DDB',
              [
                ['input[aria-label="Data storage size Value"]:visible',2],
                ['input[aria-label="Number of writes Value"]:visible',0.1],
                ['input[aria-label="Number of reads Value"]:visible',0.5]
              ],
              async () => {
                await page.locator('input[type="checkbox"]').evaluateAll(els=>{
                  for(const i of els) {
                    const id=i.getAttribute('aria-labelledby');
                    const label=id?document.getElementById(id)?.innerText.trim():'';
                    if(label==='DynamoDB on-demand capacity'&&!i.checked)i.click();
                    if(label==='DynamoDB provisioned capacity'&&i.checked)i.click();
                  }
                });
                await page.waitForTimeout(500);
              }
            );

            await configure(
              'CloudWatch','^Amazon CloudWatch','CW',
              [
                ['input[aria-label^="Number of Metrics (includes detailed and custom metrics)"]:visible',5],
                ['input[aria-label^="Number of other API requests"]:visible',10000],
                ['input[aria-label="Standard Logs: Data Ingested Value"]:visible',1]
              ],
              async () => {
                const logs=page.locator('[role="button"][aria-controls]').filter({hasText:/^Logs/}).first();
                await logs.click();
                await page.waitForTimeout(400);
              }
            );

            console.log('ALL_SERVICES_ADDED',page.url());
            console.log('PRE_SUMMARY_TEXT',(await page.locator('body').innerText()).slice(-8000));
            const summaryBtn=page.getByRole('button',{name:'Save and view summary',exact:true});
            console.log('SUMMARY_BUTTON_COUNT',await summaryBtn.count());
            await summaryBtn.click();
            await page.waitForTimeout(3500);
            console.log('SUMMARY_URL',page.url());
            console.log('SUMMARY_BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('SUMMARY_TEXT',(await page.locator('body').innerText()).slice(-12000));
            console.log('SUMMARY_LINKS',JSON.stringify(await page.locator('a').evaluateAll(els=>els.map(a=>({text:a.innerText.trim(),href:a.href})).filter(x=>x.href.includes('calculator.aws')))));
            const shareTargets=page.getByRole('button').filter({hasText:/Share/i});
            console.log('SHARE_TARGETS',await shareTargets.count());
            if(await shareTargets.count()) {
              await shareTargets.first().click();
              await page.waitForTimeout(1200);
              console.log('SHARE_DIALOG_TEXT',(await page.locator('body').innerText()).slice(-6000));
              console.log('SHARE_DIALOG_INPUTS',JSON.stringify(await page.locator('input').evaluateAll(els=>els.map(x=>({aria:x.getAttribute('aria-label'),value:x.value,placeholder:x.placeholder})).filter(x=>x.value||x.placeholder))));
              console.log('SHARE_DIALOG_LINKS',JSON.stringify(await page.locator('a').evaluateAll(els=>els.map(a=>({text:a.innerText.trim(),href:a.href})).filter(x=>x.href.includes('calculator.aws')))));
            }
          } finally { await browser.close(); }
          JS
