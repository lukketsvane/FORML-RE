name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-s3-section:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Inspect S3 Standard section
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1200}});
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/',{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForTimeout(2200);
            await page.getByRole('button',{name:'Create estimate'}).last().click();
            await page.waitForURL(/addService/,{timeout:30000});
            await page.waitForTimeout(1000);
            await page.getByRole('button',{name:'US East (Ohio)'}).click();
            await page.waitForTimeout(250);
            await page.getByText('US East (N. Virginia)',{exact:true}).last().click();
            await page.waitForTimeout(400);
            await page.locator('input[placeholder="Search for a service"]').fill('S3');
            await page.waitForTimeout(600);
            const cards=await page.locator('li').evaluateAll(els=>els.map((el,i)=>({i,text:(el.innerText||'').trim()})).filter(x=>x.text.startsWith('Amazon Simple Storage Service')));
            await page.locator('li').nth(cards[0].i).getByRole('button',{name:'Configure'}).click();
            await page.waitForTimeout(1400);
            const storageCount=await page.locator('input[aria-label="S3 Standard storage Value"]').count();
            console.log('S3_STORAGE_COUNT',storageCount);
            const inputStates=await page.locator('input').evaluateAll(els=>els.map((x,i)=>({
              i,aria:x.getAttribute('aria-label'),value:x.value,visible:!!x.offsetParent,
              label:x.getAttribute('aria-labelledby')?document.getElementById(x.getAttribute('aria-labelledby'))?.innerText.trim():''
            })).filter(x=>/S3 Standard|Data transfer/i.test((x.aria||'')+' '+(x.label||''))));
            console.log('S3_INPUT_STATES',JSON.stringify(inputStates));
            const roles=await page.locator('[role="button"][aria-expanded]').evaluateAll(els=>els.map((x,i)=>({
              i,expanded:x.getAttribute('aria-expanded'),text:(x.innerText||'').trim().slice(0,180),
              id:x.id,controls:x.getAttribute('aria-controls')
            })));
            console.log('S3_ROLES',JSON.stringify(roles));
            const titles=await page.locator('h2,h3,h4').evaluateAll(els=>els.map(x=>({text:x.innerText,cls:String(x.className).slice(0,100)})));
            console.log('S3_TITLES',JSON.stringify(titles));
          }finally{await browser.close();}
          JS
