name: AWS research credit calculator builder

on:
  push:
    branches:
      - research/fable-literature-audit-2026-11
    paths:
      - .github/workflows/aws-credit-estimate.yml

permissions:
  contents: read

concurrency:
  group: aws-credit-estimate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  inspect-lambda:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium

      - name: Inspect AWS Lambda configuration form
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1200 } });
            page.setDefaultTimeout(10000);
            await page.goto('https://calculator.aws/#/', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.getByRole('button', { name: 'Create estimate' }).last().click();
            await page.waitForURL(/addService/, { timeout: 30000 });
            await page.waitForTimeout(1500);
            await page.getByRole('button', { name: 'US East (Ohio)' }).click();
            await page.waitForTimeout(300);
            await page.getByText('US East (N. Virginia)', { exact: true }).last().click();
            await page.waitForTimeout(500);
            const search = page.locator('input[placeholder="Search for a service"]');
            await search.fill('AWS Lambda');
            await page.waitForTimeout(800);
            console.log('SEARCH_TEXT', (await page.locator('body').innerText()).slice(-5000));
            const card = page.getByText('AWS Lambda', { exact:true }).first().locator('xpath=ancestor::li[contains(@class,"awsui_card_")][1]');
            console.log('LAMBDA_CARD_BUTTONS', JSON.stringify(await card.getByRole('button').allTextContents()));
            await card.getByRole('button', { name:'Configure' }).click();
            await page.waitForTimeout(2200);
            console.log('LAMBDA_URL', page.url());
            console.log('LAMBDA_FORM_TEXT', (await page.locator('body').innerText()).slice(-10000));
            console.log('LAMBDA_INPUTS', JSON.stringify(await page.locator('input').evaluateAll(els=>els.map((x,i)=>({i,type:x.type,aria:x.getAttribute('aria-label'),placeholder:x.placeholder,value:x.value,checked:x.checked,disabled:x.disabled,outer:x.outerHTML.slice(0,400)})))));
            console.log('LAMBDA_SELECTS', JSON.stringify(await page.locator('select').evaluateAll(els=>els.map(x=>({aria:x.getAttribute('aria-label'),value:x.value,options:[...x.options].map(o=>o.text)})))));
            console.log('LAMBDA_BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
          } finally { await browser.close(); }
          JS
