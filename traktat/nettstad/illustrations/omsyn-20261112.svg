    <text x="624" y="157" font-size="34" text-anchor="start">toleranse</text>
    <text x="430" y="262" font-size="34" text-anchor="middle">målregion</text>
    <text x="850" y="252" font-size="34" text-anchor="middle">posisjon</text>
