<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="omsyn-title omsyn-desc">
  <title id="omsyn-title">Eit omsyn</title>
  <desc id="omsyn-desc">Ein vassrett akse merkt X med indeks k. Eit skravert intervall på aksen er merkt målregion. Ei stipla loddrett line står like langt frå målregionen på kvar side og markerer toleransen. Ein posisjon ligg som ein prikk på aksen til høgre, utanfor toleransen. Over aksen viser to mål frå kanten av målregionen: det korte, merkt toleranse, går ut til den stipla lina, og det lange, merkt avvik, går ut til posisjonen.</desc>
