<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="landskap-title landskap-desc">
  <title id="landskap-title">Tilpassingslandskapet</title>
  <desc id="landskap-desc">Ei kurve over formrommet med spenning på den loddrette aksen. Kurva har ein grunn dal til venstre, ein rygg i midten og ein djup dal til høgre. Ein prikk ligg i botnen av den grunne dalen.</desc>
  <rect x="0" y="0" width="1000" height="660" fill="#fff"/>
