<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="940" viewBox="0 0 1254 940" role="img" aria-labelledby="verknadskjegle-title verknadskjegle-desc">
  <title id="verknadskjegle-title">Lyskjegle og verknadskjegle</title>
  <desc id="verknadskjegle-desc">To kjegler stig frå same punkt, der forma vert realisert. Den venstre er lyskjegla til agenten, den høgre verknadskjegla til forma. Dei overlappar delvis. Den delen av lyskjegla som ligg utanfor verknadskjegla, er merkt mål utan verknad. Den delen av verknadskjegla som ligg utanfor lyskjegla, er skravert og merkt verknad utan mål.</desc>
